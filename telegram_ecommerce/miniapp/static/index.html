<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f8f7f4" />
    <title>Shop · DailyObjects</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <div class="brand-line">
        <a href="/" id="brand">DailyObjects<span>Everyday, considered.</span></a
        ><span class="edition">THE EVERYDAY EDIT</span>
      </div>
      <form id="search" role="search">
        <label class="sr-only" for="query">Search products</label
        ><span aria-hidden="true">⌕</span
        ><input
          id="query"
          type="search"
          maxlength="100"
          placeholder="Find your everyday essential"
          autocomplete="off"
        /><button type="submit">Search</button>
      </form>
      <nav id="categories" aria-label="Product categories"></nav>
    </header>
    <main>
      <div class="collection">
        <div>
          <p class="eyebrow">MADE FOR YOUR EVERYDAY</p>
          <h1 id="heading">Good things. Daily.</h1>
        </div>
        <span id="count"></span>
      </div>
      <p id="status" role="status" aria-live="polite">
        Loading your collection…
      </p>
      <button id="retry" hidden>Try again</button>
      <div id="products" class="grid" aria-label="Products"></div>
      <button id="more" hidden>Show more products</button>
      <footer>Catalog preview · checkout isn’t available yet.</footer>
    </main>
    <dialog id="detail">
      <button id="close" class="close" aria-label="Close product details">
        ×
      </button>
      <div id="detail-content"></div>
      <button id="ask">Open product in chat ↗</button>
    </dialog>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
